<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eco Energy Asesores</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b1220;
  color: white;
}

header {
  display: flex;
  justify-content: space-between;
  padding: 15px;
  background: white;
  color: black;
}

.btn {
  background: #22c55e;
  padding: 10px 18px;
  border-radius: 25px;
  color: white;
  text-decoration: none;
  font-weight: bold;
}

.hero {
  padding: 40px 20px;
  text-align: center;
}

.hero h1 {
  font-size: 34px;
}

.section {
  padding: 30px 20px;
}

.card {
  background: #111827;
  padding: 20px;
  margin-bottom: 15px;
  border-radius: 15px;
}

img {
  width: 100%;
  border-radius: 15px;
  margin-bottom: 10px;
}
</style>
</head>

<body>

<header>
  <b>ECO ENERGY</b>
  <a class="btn" href="https://wa.me/50769453126">WhatsApp</a>
</header>

<section class="hero">
  <h1>Paga $0 en luz ⚡</h1>
  <p>Ahorra hasta 70% con energía solar en Panamá</p>
  <a class="btn" href="https://wa.me/50769453126">Cotizar ahora</a>
</section>

<section class="section">
  <div class="card">
    <img src="https://images.unsplash.com/photo-1509395176047-4a66953fd231">
    <h2>Residencial</h2>
    <p>Reduce tu factura eléctrica casi a cero.</p>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1508514177221-188b1cf16e9d">
    <h2>Comercial</h2>
    <p>Ahorro de 30% a 70% en negocios.</p>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1581091215367-59ab6b9d1e4d">
    <h2>Monitoreo</h2>
    <p>Controla tu sistema desde tu celular.</p>
  </div>
</section>

<section class="section">
  <div class="card">
    <h2>Calcula tu ahorro</h2>
    <input id="factura" placeholder="Factura mensual $" style="width:100%;padding:10px;margin-top:10px;">
    <button class="btn" onclick="calc()">Calcular</button>
    <p id="resultado"></p>
  </div>
</section>

<script>
function calc(){
  let f = document.getElementById("factura").value;
  let ahorro = f * 0.7;
  document.getElementById("resultado").innerText = "Ahorro estimado: $" + ahorro;
}
</script>

</body>
</html>
